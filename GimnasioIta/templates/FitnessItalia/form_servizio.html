{% extends 'FitnessItalia/base.html' %}

{% block title %}FitnessPlus Italia - Gestione Servizio{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 bg-white">
            <h3 class="mb-3">{% if servizio %}Modifica Servizio{% else %}Nuovo Servizio{% endif %}</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Salva</button>
            </form>
            <a href="{% url 'lista_servizi' %}" class="btn btn-secondary mt-3 w-100">Torna Indietro</a>
        </div>
    </div>
</div>
{% endblock %}
