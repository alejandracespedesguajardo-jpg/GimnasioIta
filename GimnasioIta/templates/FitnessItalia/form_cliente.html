{% extends 'FitnessItalia/base.html' %}

{% block title %}FitnessPlus Italia - Gestione Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 bg-white">
            <h3 class="mb-3">{% if cliente %}Modifica Cliente{% else %}Nuovo Cliente{% endif %}</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Salva</button>
            </form>
            <a href="{% url 'lista_clienti' %}" class="btn btn-secondary mt-3 w-100">Torna Indietro</a>
        </div>
    </div>
</div>
{% endblock %}
