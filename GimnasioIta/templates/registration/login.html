<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>FitnessPlus Italia - Accesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h3>FitnessPlus Italia - Login</h3>
                    </div>
                    <div class="card-body">
                        {% if form.errors %}
                            <div class="alert alert-danger">Nome utente o password non validi. Riprova.</div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary w-100">Accedi</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a href="{% url 'registrazione' %}">Non hai un account? Registrati qui</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
